<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — EduTrack</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="auth-center-page">
  <div style="width:100%;max-width:420px;">
    <div class="brand" style="margin-bottom:24px;"><span class="mark">E</span><span>EduTrack</span></div>
    <h2 class="h2">Set a New Password</h2>
    <p class="subhead" style="margin-bottom:28px;">Choose a new password for your account.</p>
    <form id="reset-form" novalidate>
      <div class="field" id="field-password"><label>New Password</label><input class="input" id="password" type="password"><span class="error-msg">Password must be at least 6 characters.</span></div>
      <div class="field" id="field-confirmPassword"><label>Confirm New Password</label><input class="input" id="confirmPassword" type="password"><span class="error-msg">Passwords do not match.</span></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Reset Password</button>
    </form>
  </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
<script>initResetPasswordForm();</script>
</body>
</html>
