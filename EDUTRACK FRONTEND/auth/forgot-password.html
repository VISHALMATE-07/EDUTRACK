<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — EduTrack</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="auth-center-page">
  <div style="width:100%;max-width:420px;">
    <a href="choose-login.html" class="back-link">← Back to Login</a>
    <div class="brand" style="margin-bottom:24px;"><span class="mark">E</span><span>EduTrack</span></div>

    <div id="forgot-step">
      <h2 class="h2">Forgot your password?</h2>
      <p class="subhead" style="margin-bottom:28px;">Enter your email and we'll send you a demo reset link.</p>
      <form id="forgot-form" novalidate>
        <div class="field" id="field-email"><label>Email</label><input class="input" id="email" type="email" placeholder="you@college.edu"><span class="error-msg">Enter a valid email address.</span></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Send Reset Link</button>
      </form>
    </div>

    <div class="alert alert-success" id="forgot-success" style="display:none;">
      If an account exists for that email, a reset link has been sent (demo only — no email is actually sent). You can continue to <a href="reset-password.html" style="color:inherit;font-weight:700;">reset your password</a>.
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
<script>initForgotPasswordForm();</script>
</body>
</html>
